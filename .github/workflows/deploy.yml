# 每次推送到 main，自动构建并发布到 GitHub Pages。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 用 npm install 而不是 npm ci：在 Mac 上生成的 lock 文件会漏掉 Linux 上才需要的可选依赖，npm ci 会因此报错
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SITE_URL: https://skystellan.github.io
          BASE_PATH: /otter-handbook/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
